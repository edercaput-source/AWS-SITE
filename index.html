<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EWS Gestor — Sistemas e Gestão Empresarial</title>
    <meta
      name="description"
      content="A EWS Gestor reúne tecnologia, orientação e acompanhamento empresarial para ajudar negócios a organizar suas informações, compreender sua operação e aprimorar a forma como são administrados."
    />
    <meta
      name="keywords"
      content="EWS Gestor, sistemas de gestão, ERP empresarial, gestão assistida, gestão completa, BPO financeiro, BPO administrativo, organização de processos, orientação empresarial"
    />
    <meta name="author" content="EWS Gestor" />
    <meta name="robots" content="index, follow" />

    <!-- Official Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="msapplication-TileImage" content="/favicon.png" />
    <meta name="theme-color" content="#17181A" />

    <!-- OpenGraph / Facebook / WhatsApp (Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EWS Gestor" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="EWS Gestor — Sistemas e Gestão Empresarial" />
    <meta
      property="og:description"
      content="A EWS Gestor reúne tecnologia, orientação e acompanhamento empresarial para ajudar negócios a organizar suas informações, compreender sua operação e aprimorar a forma como são administrados."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:secure_url" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EWS Gestor — Sistemas e Gestão Empresarial" />
    <!-- Specific WhatsApp Link Preview Image -->
    <link rel="image_src" href="/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EWS Gestor — Sistemas e Gestão Empresarial" />
    <meta
      name="twitter:description"
      content="A EWS Gestor reúne tecnologia, orientação e acompanhamento empresarial para ajudar negócios a organizar suas informações, compreender sua operação e aprimorar a forma como são administrados."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Dynamic origin resolution for social sharing meta tags -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.location && window.location.origin) {
          var origin = window.location.origin;
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg && !ogImg.content.startsWith('http')) {
            ogImg.setAttribute('content', origin + '/og-image.jpg');
          }
          var ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogImgSec && !ogImgSec.content.startsWith('http')) {
            ogImgSec.setAttribute('content', origin + '/og-image.jpg');
          }
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg && !twImg.content.startsWith('http')) {
            twImg.setAttribute('content', origin + '/og-image.jpg');
          }
          var imgLink = document.querySelector('link[rel="image_src"]');
          if (imgLink && !imgLink.href.startsWith('http')) {
            imgLink.setAttribute('href', origin + '/og-image.jpg');
          }
        }
      })();
    </script>

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "EWS Gestor",
        "legalName": "EWS Gestor — Sistemas e Gestão Empresarial",
        "slogan": "Sistemas e Gestão Empresarial",
        "description": "A EWS Gestor reúne tecnologia, orientação e acompanhamento empresarial para ajudar negócios a organizar suas informações, compreender sua operação e aprimorar a forma como são administrados.",
        "url": "https://ewsgestor.com.br",
        "logo": "https://ewsgestor.com.br/favicon.png",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "commercial",
          "availableLanguage": "Portuguese"
        }
      }
    </script>
  </head>
  <body class="bg-[#F5F1EB] text-[#171719] font-sans antialiased selection:bg-[#702D3A] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
