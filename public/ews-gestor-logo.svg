<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <!-- Symbol Icon on the Left -->
  <g transform="translate(4, 8)">
    <rect width="64" height="64" rx="14" fill="#F5F1EB"/>
    <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#171719" stroke-opacity="0.12" stroke-width="1"/>
    <!-- Monogram vectors -->
    <path d="M16 20 H48" stroke="#171719" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M16 20 V44 H48" stroke="#171719" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 32 H42" stroke="#702D3A" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="46" cy="20" r="3" fill="#702D3A"/>
    <circle cx="44" cy="44" r="3" fill="#702D3A"/>
  </g>
  
  <!-- Typography on the Right -->
  <g transform="translate(84, 20)">
    <!-- Brand Name: EWS GESTOR -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="1.5" fill="#171719">
      EWS <tspan fill="#702D3A">GESTOR</tspan>
    </text>
    
    <!-- Institutional Signature: Sistemas e Gestão Empresarial -->
    <text x="0" y="43" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="500" font-size="11.5" letter-spacing="0.4" fill="#777777">
